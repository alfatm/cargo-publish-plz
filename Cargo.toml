[package]
name = "cargo-publish-plz"
version = "1.1.0"
edition = "2024"
authors = ["Andrew Panin <alfatm@gmail.com>"]
description = "Bump versions of changed workspace crates and publish unpublished ones, without forge integration"
license = "MIT"
repository = "https://github.com/alfatm/cargo-publish-plz"
readme = "README.md"
keywords = ["cargo", "release", "publish", "version", "workspace"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
exclude = ["rustfmt.toml", "clippy.toml", ".gitignore"]

[lints.rust]
async_fn_in_trait = "allow"
double_negations = "deny"

[lints.clippy]
enum_glob_use = "deny"
perf = { level = "deny", priority = -1 }
unused_async = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
cast_lossless = "allow"

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
erris = { version = "3.3", default-features = false }
flate2 = "1.1.10"
globset = "0.4.20"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
toml_edit = "0.25.16"
ureq = "3.4.2"
